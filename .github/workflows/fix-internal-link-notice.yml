name: Remove injected related resources

on:
  push:
    paths-ignore:
      - '.github/workflows/fix-internal-link-notice.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Related Resources blocks from HTML
        shell: python
        run: |
          from pathlib import Path
          import re

          pattern = re.compile(
              r'\s*<section class="internal-link-resources"[^>]*>.*?</section>\s*',
              re.DOTALL,
          )

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              cleaned = pattern.sub('\n', text)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(str(path))

          print('Cleaned:', ', '.join(changed) if changed else 'none')

      - name: Remove temporary trigger and this obsolete workflow
        shell: bash
        run: |
          rm -f .related-resources-cleanup-trigger
          rm -f .github/workflows/fix-internal-link-notice.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes needed"
            exit 0
          fi
          git commit -m "fix(seo): remove related resources injection [skip ci]"
          git push
