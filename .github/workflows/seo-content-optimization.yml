name: SEO Content Optimization

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-seo-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Screaming Frog SEO issues
        run: python scripts/screamingfrog_seo_fix.py

      - name: Commit SEO fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No SEO changes required."
          else
            git commit -m "fix(seo): resolve Screaming Frog title meta and internal redirect issues"
            git push
          fi
