name: Fix Twitter Link

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-twitter-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace broken Twitter URL
        shell: bash
        run: |
          set -e
          find . -type f -not -path './.git/*' -not -path './.github/workflows/fix-twitter-link.yml' -print0 \
            | xargs -0 grep -Il 'https://twitter.com/Ahsan_OnTop01' \
            | xargs -r sed -i 's#https://twitter.com/Ahsan_OnTop01#https://x.com/Ahsan_OnTop01#g'

      - name: Commit replacement and remove temporary workflow
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/fix-twitter-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No broken Twitter links found.'
            exit 0
          fi
          git commit -m 'fix: replace broken Twitter profile link with X profile'
          git push
