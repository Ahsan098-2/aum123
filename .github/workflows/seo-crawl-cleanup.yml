name: SEO Crawl Cleanup

on:
  push:
    paths:
      - '.github/workflows/seo-crawl-cleanup.yml'
      - 'tools/*.html'
      - 'articles/*.html'
      - 'index.html'
      - 'tools.html'
      - 'about.html'
      - 'privacy.html'
      - 'terms.html'
      - 'contact.html'
      - 'blog.html'
      - 'sitemap.xml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize URLs, canonical and social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from html import escape

          BASE = 'https://dailytoolkit.xyz'
          EXCLUDED = {'404.html', 'google0c818b49b1950c41.html'}

          def clean_url_for(path):
              p = path.as_posix()
              if p == 'index.html':
                  return BASE + '/'
              if p == 'tools.html':
                  return BASE + '/tools'
              root_map = {'about.html':'/about','privacy.html':'/privacy','terms.html':'/terms','contact.html':'/contact','blog.html':'/blog'}
              if p in root_map:
                  return BASE + root_map[p]
              if p.endswith('/index.html'):
                  return BASE + '/' + p[:-10].rstrip('/')
              if p.endswith('.html'):
                  return BASE + '/' + p[:-5]
              return BASE + '/' + p

          def meta_content(tag):
              if not tag:
                  return ''
              m = re.search(r'content=["\\'](.*?)["\\']', tag, re.I | re.S)
              return re.sub(r'\\s+', ' ', m.group(1)).strip() if m else ''

          def remove_meta(text, attr, value):
              return re.sub(rf'<meta\\s+[^>]*{attr}=["\\']{re.escape(value)}["\\'][^>]*>\\s*', '', text, flags=re.I)

          def add_or_replace_meta(text, attr, value, content):
              text = remove_meta(text, attr, value)
              tag = f'<meta {attr}="{escape(value)}" content="{escape(content)}">\\n'
              return re.sub(r'</head>', tag + '</head>', text, count=1, flags=re.I)

          def canonical_for(path):
              # website-seo-audit-tool is a duplicate utility page. Its authoritative
              # page is the shorter website-seo-audit URL, which returns 200.
              if path.as_posix() == 'tools/website-seo-audit-tool.html':
                  return BASE + '/tools/website-seo-audit'
              return clean_url_for(path)

          def add_canonical(text, url):
              text = re.sub(r'<link\\s+[^>]*rel=["\\']canonical["\\'][^>]*>\\s*', '', text, flags=re.I)
              tag = f'<link rel="canonical" href="{escape(url)}">\\n'
              return re.sub(r'</head>', tag + '</head>', text, count=1, flags=re.I)

          files = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or 'node_modules' in p.parts or p.name in EXCLUDED:
                  continue
              files.append(p)

              text = p.read_text(encoding='utf-8')
              original = text

              # Vercel cleanUrls redirects .html URLs. Use the final clean URLs in internal links.
              text = re.sub(r'(?P<prefix>(?:href|src)=["\\'])/(?P<url>[^"\\']+?)\\.html(?P<suffix>["\\'])', r'\\g<prefix>/\\g<url>\\g<suffix>', text, flags=re.I)
              text = re.sub(r'(?P<prefix>(?:href|src)=["\\'])https://dailytoolkit\\.xyz/(?P<url>[^"\\']+?)\\.html(?P<suffix>["\\'])', r'\\g<prefix>https://dailytoolkit.xyz/\\g<url>\\g<suffix>', text, flags=re.I)

              # Exactly one description tag.
              matches = list(re.finditer(r'<meta\\s+[^>]*name=["\\']description["\\'][^>]*>', text, flags=re.I))
              if len(matches) > 1:
                  first_end = matches[0].end()
                  tail = re.sub(r'<meta\\s+[^>]*name=["\\']description["\\'][^>]*>\\s*', '', text[first_end:], flags=re.I)
                  text = text[:first_end] + tail

              tm = re.search(r'<title>(.*?)</title>', text, flags=re.I | re.S)
              title = re.sub(r'\\s+', ' ', tm.group(1)).strip() if tm else p.stem.replace('-', ' ').title()
              dm = re.search(r'<meta\\s+[^>]*name=["\\']description["\\'][^>]*>', text, flags=re.I)
              desc = meta_content(dm.group(0) if dm else None)
              if not desc:
                  desc = f'{title}. Free online utility from Daily Toolkit.'
                  text = add_or_replace_meta(text, 'name', 'description', desc)

              url = canonical_for(p)
              text = add_canonical(text, url)

              # Complete OG + X/Twitter metadata for all public pages.
              text = add_or_replace_meta(text, 'property', 'og:title', title)
              text = add_or_replace_meta(text, 'property', 'og:description', desc)
              text = add_or_replace_meta(text, 'property', 'og:type', 'website')
              text = add_or_replace_meta(text, 'property', 'og:url', url)
              text = add_or_replace_meta(text, 'property', 'og:site_name', 'Daily Toolkit')
              text = add_or_replace_meta(text, 'property', 'og:image', f'{BASE}/assets/preview.png')
              text = add_or_replace_meta(text, 'name', 'twitter:card', 'summary_large_image')
              text = add_or_replace_meta(text, 'name', 'twitter:title', title)
              text = add_or_replace_meta(text, 'name', 'twitter:description', desc)
              text = add_or_replace_meta(text, 'name', 'twitter:image', f'{BASE}/assets/preview.png')

              if text != original:
                  p.write_text(text, encoding='utf-8')

          # Sitemap must contain only clean final URLs. The duplicate SEO audit tool
          # is intentionally omitted because its canonical points to the primary page.
          urls = []
          for p in sorted(files, key=lambda x: x.as_posix()):
              if p.as_posix() == 'tools/website-seo-audit-tool.html':
                  continue
              urls.append(clean_url_for(p))

          unique = []
          seen = set()
          for u in urls:
              if u not in seen:
                  seen.add(u)
                  unique.append(u)

          lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in unique:
              priority = '1.0' if u == BASE + '/' else ('0.9' if '/tools' in u else '0.7')
              freq = 'weekly' if u == BASE + '/' or '/tools' in u or u.endswith('/blog') or u.endswith('/articles') else 'monthly'
              lines.append(f'  <url><loc>{escape(u)}</loc><lastmod>2026-08-30</lastmod><changefreq>{freq}</changefreq><priority>{priority}</priority></url>')
          lines.append('</urlset>')
          Path('sitemap.xml').write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
          PY

      - name: Commit SEO cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No crawl cleanup changes required.'
          else
            git commit -m 'SEO: repair canonical sitemap redirects and social tags [skip ci]'
            git push
          fi
