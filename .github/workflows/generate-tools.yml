name: Generate 1000 Daily Toolkit tools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate tool pages
        run: python scripts/generate-1000-tools.py
      - name: Inject homepage catalog
        run: python scripts/inject-home-catalog.py
      - name: Commit generated pages and homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated-tools index.html catalog-home.js scripts/inject-home-catalog.py
          git diff --cached --quiet || git commit -m 'Connect all 1000 tools to homepage'
          git push
