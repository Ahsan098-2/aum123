name: Fix canonical DOM append error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch canonical.js safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/js/canonical.js')
          text = path.read_text(encoding='utf-8')

          old = "document.head.appendChild(style); (document.querySelector('main') || document.body).appendChild(guide);"
          new = "document.head.appendChild(style); var mountGuide = function(){ var target = document.querySelector('main') || document.body; if(target) target.appendChild(guide); }; if(document.body) mountGuide(); else document.addEventListener('DOMContentLoaded', mountGuide, {once:true});"

          if old not in text:
              print('Target already patched or source changed; no update needed.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Patched canonical.js DOM append target.')

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- assets/js/canonical.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/canonical.js
          git commit -m "fix: prevent canonical guide DOM null error [skip ci]"
          git push