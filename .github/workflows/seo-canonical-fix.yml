name: SEO Canonical Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-canonical-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize static canonical tags on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          ORIGIN = 'https://dailytoolkit.xyz'
          canonical_re = re.compile(r'<link\s+[^>]*rel=["\']canonical["\'][^>]*>', re.I)
          changed = []

          def canonical_for(path: Path) -> str:
              rel = path.as_posix()
              if rel == 'index.html':
                  return ORIGIN + '/'
              clean = re.sub(r'\.html$', '', rel, flags=re.I)
              return ORIGIN + '/' + clean.lstrip('/')

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              text = path.read_text(encoding='utf-8')
              if not re.search(r'</head\s*>', text, re.I):
                  continue

              canonical_url = canonical_for(path)
              tag = f'<link rel="canonical" href="{canonical_url}" />'

              # Remove every existing canonical tag, then insert exactly one in <head>.
              cleaned = canonical_re.sub('', text)
              head_end = re.search(r'</head\s*>', cleaned, re.I)
              cleaned = cleaned[:head_end.start()] + '  ' + tag + '\n' + cleaned[head_end.start():]

              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(str(path))

          print(f'Canonical normalization changed {len(changed)} HTML files')
          for item in changed:
              print(item)

      - name: Commit canonical normalization changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No canonical changes required."
          else
            git commit -m "fix(seo): normalize static canonical tags"
            git push
          fi
