name: Daily Toolkit Content Quality Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tool content, articles and legal navigation
        run: python scripts/content_quality_upgrade.py

      - name: Commit generated content
        run: |
          git config user.name "dailytoolkit-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools articles blog.html about.html contact.html privacy.html terms.html
          if git diff --cached --quiet; then
            echo "No content changes needed."
          else
            git commit -m "Improve tool content, blog guides and site trust pages"
            git push
          fi
